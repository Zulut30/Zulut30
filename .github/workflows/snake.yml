name: Generate contribution animation

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out profile source
        uses: actions/checkout@v7

      - name: Generate activity dashboard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/generate_activity.py --user "${{ github.repository_owner }}"

      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23f59e0b&color_dots=%2307111f,%230c4a6e,%230e7490,%2306b6d4,%2338bdf8
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%23f59e0b&color_dots=%2307111f,%230c4a6e,%230e7490,%2306b6d4,%2338bdf8

      - name: Publish activity artwork
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
