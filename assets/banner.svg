<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Manacost Dev</title>
  <desc id="desc">Engineering digital worlds around games, content and AI</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#030712"/>
      <stop offset=".48" stop-color="#081426"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="cyanGold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset=".48" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <radialGradient id="core" cx="50%" cy="45%" r="60%">
      <stop offset="0" stop-color="#e0f2fe"/>
      <stop offset=".18" stop-color="#38bdf8"/>
      <stop offset=".56" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#081426"/>
    </radialGradient>
    <radialGradient id="aura">
      <stop offset="0" stop-color="#38bdf8" stop-opacity=".32"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#94a3b8" stroke-opacity=".055"/>
    </pattern>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft"><feGaussianBlur stdDeviation="32"/></filter>
  </defs>

  <rect width="1200" height="420" rx="26" fill="url(#bg)"/>
  <rect width="1200" height="420" rx="26" fill="url(#grid)"/>
  <ellipse cx="600" cy="214" rx="470" ry="245" fill="url(#aura)" filter="url(#soft)"/>

  <g opacity=".65" stroke="#38bdf8" fill="none">
    <path d="M0 320C205 252 355 357 540 284S905 207 1200 305" stroke-opacity=".2"/>
    <path d="M0 340C230 265 380 375 567 298S925 225 1200 322" stroke-opacity=".1"/>
  </g>

  <g transform="translate(600 172)">
    <circle r="122" fill="none" stroke="#38bdf8" stroke-opacity=".12" stroke-width="1" stroke-dasharray="3 10"/>
    <circle r="91" fill="none" stroke="#f59e0b" stroke-opacity=".28" stroke-width="1.5" stroke-dasharray="18 10"/>
    <g opacity=".7">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="18s" repeatCount="indefinite"/>
      <circle cx="0" cy="-122" r="4" fill="#38bdf8" filter="url(#glow)"/>
      <circle cx="0" cy="122" r="3" fill="#f59e0b" filter="url(#glow)"/>
    </g>
    <path d="M0-67 57-33 57 34 0 68-57 34-57-33Z" fill="#071a30" stroke="url(#cyanGold)" stroke-width="3" filter="url(#glow)"/>
    <path d="M0-47 38-24 38 23 0 47-38 23-38-24Z" fill="url(#core)"/>
    <path d="M4-37C-20-18-21 11-2 26c14 11 34 7 43-7-18 8-34-1-36-15-2-13 6-26 20-31-7-7-14-10-21-10Z" fill="#f8fafc" fill-opacity=".9"/>
  </g>

  <g font-family="Segoe UI, Inter, Arial, sans-serif">
    <text x="600" y="294" text-anchor="middle" fill="#f8fafc" font-size="61" font-weight="800" letter-spacing="6">MANACOST</text>
    <text x="600" y="337" text-anchor="middle" fill="url(#cyanGold)" font-size="22" font-weight="700" letter-spacing="12">DEV</text>
    <text x="600" y="376" text-anchor="middle" fill="#94a3b8" font-size="15" font-weight="500" letter-spacing="2.6">GAMES  ·  CONTENT  ·  AUTOMATION  ·  AI</text>
  </g>

  <g fill="#38bdf8">
    <circle cx="145" cy="104" r="3"><animate attributeName="opacity" values=".2;1;.2" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="1038" cy="92" r="2"><animate attributeName="opacity" values="1;.15;1" dur="2.7s" repeatCount="indefinite"/></circle>
    <circle cx="1086" cy="252" r="3"><animate attributeName="opacity" values=".1;.9;.1" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="112" cy="276" r="2"><animate attributeName="opacity" values=".9;.2;.9" dur="3.5s" repeatCount="indefinite"/></circle>
  </g>
  <g fill="none" stroke-linecap="round">
    <path d="M76 74h72M76 74v72" stroke="#38bdf8" stroke-opacity=".4" stroke-width="2"/>
    <path d="M1124 346h-72M1124 346v-72" stroke="#f59e0b" stroke-opacity=".4" stroke-width="2"/>
  </g>
  <rect x="1" y="1" width="1198" height="418" rx="25" fill="none" stroke="url(#cyanGold)" stroke-opacity=".42" stroke-width="2"/>
</svg>
