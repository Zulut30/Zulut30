<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Manacost Dev</title>
  <desc id="desc">Hearthstone, automation and AI</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.52" stop-color="#0b1b32"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#38bdf8" stop-opacity=".3"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="26"/></filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#020617" flood-opacity=".65"/>
    </filter>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#94a3b8" stroke-opacity=".055"/>
    </pattern>
  </defs>

  <rect width="1200" height="360" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="24" fill="url(#grid)"/>
  <ellipse cx="250" cy="85" rx="300" ry="210" fill="url(#glow)" filter="url(#blur)"/>
  <ellipse cx="1050" cy="315" rx="270" ry="180" fill="#f59e0b" opacity=".08" filter="url(#blur)"/>

  <g transform="translate(92 70)" filter="url(#shadow)">
    <rect x="0" y="0" width="144" height="202" rx="22" fill="#0f2139" stroke="#38bdf8" stroke-width="2" transform="rotate(-8 72 101)"/>
    <rect x="30" y="8" width="144" height="202" rx="22" fill="#122846" stroke="#f59e0b" stroke-width="2" transform="rotate(8 102 109)"/>
    <path d="M103 62c24 15 31 40 14 63-16 22-48 27-69 11-20-15-24-45-8-65 13-17 37-23 56-13-19 3-31 14-30 30 2 20 26 28 39 14 10-10 9-27-2-40z" fill="none" stroke="url(#accent)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="99" cy="95" r="5" fill="#f8fafc"/>
  </g>

  <g transform="translate(315 93)">
    <text x="0" y="55" fill="#f8fafc" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="66" font-weight="800" letter-spacing="3">MANACOST DEV</text>
    <rect x="2" y="78" width="520" height="4" rx="2" fill="url(#accent)"/>
    <text x="2" y="125" fill="#94a3b8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="25" font-weight="500" letter-spacing="1.4">HEARTHSTONE  •  AUTOMATION  •  AI</text>
    <text x="2" y="171" fill="#64748b" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="17" letter-spacing=".6">BUILDING USEFUL THINGS FOR THE COMMUNITIES WE LOVE</text>
  </g>

  <g fill="none" stroke-linecap="round" opacity=".8">
    <path d="M1015 82h70m-35-35v70" stroke="#38bdf8" stroke-width="3"/>
    <circle cx="1092" cy="240" r="42" stroke="#f59e0b" stroke-width="2" stroke-dasharray="5 10"/>
    <circle cx="1092" cy="240" r="12" stroke="#38bdf8" stroke-width="3"/>
  </g>
  <rect x="1" y="1" width="1198" height="358" rx="23" fill="none" stroke="#334155" stroke-opacity=".8" stroke-width="2"/>
</svg>
