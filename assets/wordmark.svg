<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="132" viewBox="0 0 1000 132" role="img" aria-labelledby="title desc">
  <title id="title">Manacost Dev</title>
  <desc id="desc">Games, content, automation and AI</desc>
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset=".58" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset=".5" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g font-family="Segoe UI, Inter, Arial, sans-serif" text-anchor="middle">
    <text x="500" y="66" fill="url(#brand)" font-size="58" font-weight="800" letter-spacing="8" filter="url(#glow)">MANACOST DEV</text>
    <path d="M180 84H820" stroke="url(#fade)" stroke-width="2"/>
    <text x="500" y="113" fill="#64748b" font-size="15" font-weight="600" letter-spacing="5">GAMES · CONTENT · AUTOMATION · AI</text>
  </g>
</svg>
